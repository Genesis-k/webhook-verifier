<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Northstar Webhook Verification Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-8">
  <div class="max-w-2xl mx-auto space-y-6">
    <div>
      <h1 class="text-2xl font-bold text-teal-400">Inventory Webhook Dispatcher & Verifier</h1>
      <p class="text-xs text-slate-400 mt-1">Evaluator Mode: HMAC keys are secured server-side via environment variables.</p>
    </div>

    <div>
      <label class="block mb-2 text-sm font-medium">Payload (JSON):</label>
      <textarea id="payload" rows="5" class="w-full bg-slate-800 border border-slate-700 p-3 rounded text-sm text-green-400 font-mono">
{
  "event": "inventory.updated",
  "sku": "SKU-4402",
  "stock": 142,
  "warehouse": "NA-East"
}</textarea>
    </div>

    <div class="flex gap-4">
      <button onclick="triggerWebhook(false)" class="bg-teal-600 hover:bg-teal-500 text-white font-semibold py-2 px-4 rounded text-sm">
        Send Valid Signed Webhook
      </button>
      <button onclick="triggerWebhook(true)" class="bg-rose-700 hover:bg-rose-600 text-white font-semibold py-2 px-4 rounded text-sm">
        Send Tampered/Invalid Signature
      </button>
    </div>

    <div>
      <h2 class="text-sm font-semibold mb-2">Endpoint Response:</h2>
      <pre id="output" class="bg-black/60 border border-slate-800 p-4 rounded text-xs font-mono overflow-auto h-48 text-slate-300"></pre>
    </div>
  </div>

  <script>
    async function triggerWebhook(tamper) {
      const output = document.getElementById('output');
      const rawText = document.getElementById('payload').value;

      try {
        // Step 1: Request HMAC signature from the server signer (reads .env securely)
        const signRes = await fetch('/api/sign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            payload: JSON.parse(rawText), 
            tamper: tamper 
          })
        });

        const signData = await signRes.json();
        if (!signRes.ok) throw new Error(signData.error || 'Signing failed');

        // Step 2: Send the signed request to the actual verification endpoint
        const res = await fetch('/api/webhook', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Signature-256': signData.signature
          },
          body: signData.payload
        });

        const data = await res.json();
        output.textContent = `HTTP ${res.status}\n` + JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
